<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>F2VTT Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ============ ÉCRAN DE CONNEXION ============ -->
<div id="lockScreen">
  <form id="lockCard" autocomplete="on">
    <img id="lockLogo" src="assets/logo.png" alt="Logo F2VTT" onerror="this.style.display='none'">
    <h1><span class="green">F2VTT</span> Map</h1>
    <p>Entre le mot de passe pour accéder à la carte.</p>
    <div id="lockVersion">Version 12.0</div>
    <input id="lockPassword" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
    <button id="lockSubmit" type="submit">Accéder</button>
    <div id="lockError" aria-live="polite"></div>
  </form>
</div>

<!-- ============ EN-TÊTE ============ -->
<header id="appHeader">
  <div class="brand">
    <img src="assets/logo.png" alt="" class="brand-logo" onerror="this.style.display='none'">
    <b class="green">F2VTT</b>
    <span class="mapword">Map</span>
    <span class="by">by Ghilas</span>
  </div>
  <button class="btn" id="add" type="button">＋ Ajouter un spot</button>
</header>

<!-- ============ CARTE ============ -->
<div id="map"></div>

<div id="zoomControls" aria-label="Contrôles de la carte">
  <button class="ctrlBtn" id="zoomIn" type="button" title="Zoom avant" aria-label="Zoom avant">＋</button>
  <button class="ctrlBtn" id="zoomOut" type="button" title="Zoom arrière" aria-label="Zoom arrière">−</button>
  <button class="ctrlBtn" id="rotate" type="button" title="Faire pivoter de 45°" aria-label="Faire pivoter la carte">↻</button>
</div>

<button id="locate" type="button" title="Ma position" aria-label="Ma position">⌾</button>

<!-- Barre affichée pendant le placement d'un point / le tracé d'une ligne -->
<div id="drawBar">
  <button id="finishLine" type="button">✓ Terminer la ligne</button>
  <button id="undoPoint" type="button">↩ Retirer le dernier point</button>
  <button id="cancelDraw" type="button">✕ Annuler</button>
</div>

<div id="credits">
  <a href="https://claude.ai" target="_blank" rel="noopener">made with Claude®</a>
</div>

<div id="status" role="status" aria-live="polite"></div>

<!-- ============ CHOIX POINT / LIGNE ============ -->
<div id="drawChoice" class="panel">
  <h2>📍 Ajouter un spot</h2>
  <div class="muted">Choisis le type de tracé à ajouter.</div>
  <div class="draw-choice-actions">
    <button class="draw-choice-btn" id="addPoint" type="button">📍 Ajouter un point</button>
    <button class="draw-choice-btn" id="addLine" type="button">〰️ Ajouter une ligne</button>
  </div>
  <div class="actions" style="margin-top:8px">
    <button class="cancel" id="cancelDrawChoice" type="button">Annuler</button>
  </div>
</div>

<!-- ============ FORMULAIRE (ajout / modification) ============ -->
<div id="form" class="panel">
  <h2 id="formTitle">📍 Ajouter un spot</h2>
  <div id="formHint" class="muted"></div>

  <label for="name">Nom</label>
  <input id="name" maxlength="80" placeholder="Ex. Descente au Parc">

  <div class="row">
    <div>
      <label for="type">Catégorie</label>
      <select id="type">
        <option>Descente</option>
        <option>Sentier</option>
        <option>Pumptrack</option>
        <option>Spot urbain</option>
        <option>Rampe</option>
        <option>Skatepark</option>
        <option>Autre</option>
      </select>
    </div>
    <div>
      <label for="diff">Difficulté</label>
      <select id="diff">
        <option value="0">🔘 Varié</option>
        <option value="1">🟢 Easy</option>
        <option value="2">🟡 Plutôt easy</option>
        <option value="3">🟠 Moyen</option>
        <option value="4">🔴 Difficile</option>
        <option value="5">⚫ Hard 🔥</option>
      </select>
    </div>
  </div>

  <label for="photos">Photos — maximum 5</label>
  <input id="photos" type="file" accept="image/*" multiple>
  <div id="photoHelp" class="photo-count">0 / 5 photos</div>
  <div id="preview" class="preview"></div>

  <label for="desc">Description</label>
  <textarea id="desc" maxlength="500" placeholder="Décris le spot..."></textarea>

  <div class="actions">
    <button class="cancel" id="close" type="button">Annuler</button>
    <button class="save" id="save" type="button">Enregistrer</button>
  </div>
</div>

<!-- ============ FICHE D'UN SPOT ============ -->
<div id="info" class="panel info-panel">
  <button id="closeInfo" class="close-info" type="button" aria-label="Fermer" title="Fermer">×</button>

  <h2 id="infoName"></h2>
  <div id="infoMeta" class="muted"></div>
  <div id="infoLoc" class="muted"></div>

  <div id="infoGallery" class="gallery"></div>
  <div id="infoPhotoCount" class="photo-count"></div>

  <p id="infoDesc"></p>

  <div class="info-actions">
    <a id="googleMaps" class="act-btn maps" target="_blank" rel="noopener">📍 Ouvrir dans Google Maps</a>
    <button class="act-btn edit" id="edit" type="button">✏️ Modifier le spot</button>
    <button class="act-btn del" id="delete" type="button">🗑️ Supprimer ce spot</button>
  </div>
</div>

<!-- Visionneuse photo plein écran -->
<div id="lightbox"><img alt="Photo agrandie"></div>

<!-- Bibliothèques -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.3/dist/leaflet-rotate.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
