<!doctype html>
<html lang="fr">
<head>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>

<style>
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}

#map{background:#e5e7eb}

.ui{
position:fixed;
z-index:9999;
top:12px;
left:12px;
right:12px;
display:flex;
justify-content:space-between;
pointer-events:none
}

.logo,.btn,#locate{
pointer-events:auto;
color:#202124;
border:0;
border-radius:12px;
box-shadow:0 2px 10px #0004
}

.logo{
padding:9px 14px;
font-weight:700;
font-size:18px;
background:#000;
color:#fff;

align-items:center;
gap:5px
}

.logo b{color:#22c55e}
.logo .mapword{color:#fff}

.by{
font-size:10px;
font-weight:500;
color:#9ca3af;
margin-left:3px;
align-self:flex-end;
margin-bottom:1px
}

.btn{
padding:11px 14px;
font-weight:700;
font-size:15px;
background:#22c55e;
color:#000
}

#add{
background:#22c55e;
color:#000
}

#locate{
position:fixed;
z-index:9999;
right:14px;
bottom:28px;
border:1px solid #d1d5db;

height:50px;
font-size:21px;
background:#fff;

#locate:hover{

#zoomControls{

z-index:9999;
left:14px;
bottom:28px;

}

.zoomBtn{
width:44px;
height:44px;
border:1px solid #d1d5db;

color:#202124;
font-size:25px;

.zoomBtn:active{transform:scale(.96)}

#credits{
position:fixed;
z-index:9998;
left:14px;
bottom:8px;
font-size:10px;
color:#4b5563;
background:rgba(255,255,255,.82);

}

#credits a{
color:inherit;
text-decoration:none
}

#credits a:hover{text-decoration:underline}

#lockScreen{
position:fixed;
inset:0;
z-index:20000;
background:#000;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

#lockCard{
width:min(390px,100%);
background:#111;
color:#fff;
border-radius:20px;
padding:24px;
box-shadow:0 8px 30px #0008;
text-align:center
}

#lockLogo{
width:76px;
height:76px;
object-fit:contain;
border-radius:14px;
display:block;
margin:0 auto 14px
}

#lockCard h1{
margin:0 0 6px;
font-size:24px
}

#lockCard p{
margin:0 0 18px;
color:#9ca3af;
font-size:13px
}

#lockVersion{
margin:-8px 0 14px;
color:#6b7280;
font-size:11px
}

#lockPassword{
width:100%;
font:inherit;
margin:0 0 10px;
padding:12px;
border:1px solid #444;
border-radius:10px;
background:#fff;
color:#202124;
outline:none
}

#lockSubmit{
width:100%;
padding:12px;
border:0;
border-radius:10px;
background:#22c55e;
color:#000;
font-weight:700;
font-size:15px;
cursor:pointer
}

#lockError{
min-height:18px;
margin-top:10px;
color:#f87171;
font-size:13px
}

#status{
position:fixed;
z-index:10001;
bottom:88px;
left:50%;
transform:translateX(-50%);
background:#202124;
color:#fff;
padding:10px 14px;
border-radius:12px;
font-size:13px;
display:none
}

.panel{
position:fixed;
z-index:10000;
left:12px;
right:12px;
bottom:12px;
max-height:78vh;
overflow:auto;
background:#fff;
color:#202124;
border-radius:20px;
padding:16px;
display:none;
box-shadow:0 8px 30px #0004
}

.panel.show{display:block}

.panel h2{
margin:0 0 8px;
font-size:20px
}

.info-panel{position:fixed}

.close-info{
position:absolute;
top:10px;
right:12px;
width:40px;
height:40px;
border:0;
background:transparent;
color:#202124;
font-size:30px;
line-height:1;
border-radius:10px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center
}

.close-info:hover{background:#f1f3f4}
.close-info:active{transform:scale(.94)}

.muted,.photo-count{
color:#5f6368;
font-size:13px
}

label{
display:block;
font-size:13px;
color:#5f6368;
margin-top:10px
}

input,textarea,select{
width:100%;
font:inherit;
margin:5px 0 8px;
padding:10px;
border:1px solid #dadce0;
border-radius:10px;
background:#fff;
color:#202124
}

textarea{min-height:65px}

.row{
display:flex;
gap:8px
}

.row>div{flex:1}

.actions{
display:flex;
gap:8px
}

.actions button{
flex:1;
padding:11px;
border:0;
border-radius:10px;
font-weight:700
}

.save{
background:#188038;
color:#fff
}

.cancel{
background:#f1f3f4
}

.preview,.gallery{
display:flex;
gap:8px;
overflow-x:auto;
margin:5px 0 10px
}

.preview img{
width:72px;
height:58px;
object-fit:cover;
border-radius:8px;
cursor:pointer
}

.preview img.remove-photo{
outline:2px solid #f44336
}

.gallery{
scroll-snap-type:x mandatory
}

.gallery img{
width:100%;
max-width:360px;
height:220px;
object-fit:cover;
border-radius:12px;
flex:0 0 100%;
scroll-snap-align:start
}

.maps-btn{
display:flex;
width:100%;
height:42px;
align-items:center;
justify-content:center;
text-align:center;
text-decoration:none;
padding:0;
border-radius:11px;
background:#1a73e8;
color:#fff;
font-weight:700
}

.delete-btn{
width:100%;
height:42px;
border:0;
border-radius:11px;
padding:0;
background:#fce8e6;
color:#c5221f;
font-weight:700;
margin-top:8px
}

#drawChoice{
z-index:10002
}

.draw-choice-actions{
display:flex;
gap:8px;
margin-top:14px
}

.draw-choice-btn{
flex:1;
padding:13px 10px;
border:0;
border-radius:11px;
background:#f1f3f4;
color:#202124;
font-weight:700;
font-size:14px;
cursor:pointer
}

.draw-choice-btn:hover{
background:#e8eaed
}

.draw-choice-btn:active{
transform:scale(.98)
}

#finishLine{
display:none;
position:fixed;
z-index:10003;
left:50%;
transform:translateX(-50%);
bottom:88px;
padding:11px 16px;
border:0;
border-radius:12px;
background:#188038;
color:#fff;
font-weight:700;
font-size:14px;
box-shadow:0 3px 12px #0004;
cursor:pointer
}

#finishLine.show{
display:block
}

.leaflet-top.leaflet-right{
top:72px
}

.leaflet-control-layers{
border-radius:12px!important;
box-shadow:0 3px 12px #0003!important;
border:1px solid #d1d5db!important
}

.leaflet-control-layers-toggle{
width:42px!important;
height:42px!important
}

@media(max-width:699px){
.leaflet-control-layers{
font-size:13px
}
}

@media(min-width:700px){
.panel{
left:auto;
width:390px;
right:16px;
bottom:16px
}
}
</style>
</head>

<body>

<div id="lockScreen">
<div id="lockCard">
<img id="lockLogo" src="logo.png" alt="F2VTT logo">
<h1>F2VTT Map</h1>
<p>Entre le mot de passe pour accéder à la carte.</p>
<div id="lockVersion">Version 11.22</div>
<input id="lockPassword" type="password" autocomplete="off" placeholder="Mot de passe">
<button id="lockSubmit">Accéder</button>
<div id="lockError" aria-live="polite"></div>
</div>
</div>

<div id="map"></div>

<div id="zoomControls" aria-label="Contrôles de zoom">
<button class="zoomBtn" id="zoomIn" title="Zoom avant" aria-label="Zoom avant">+</button>
<button class="zoomBtn" id="zoomOut" title="Zoom arrière" aria-label="Zoom arrière">−</button>
</div>

<button id="finishLine" type="button">✓ Terminer la ligne</button>

<div id="credits">
<a href="https://chatgpt.com" target="_blank" rel="noopener">made with ChatGPT®</a>
</div>

<div class="ui">
<div class="logo">
<img src="logo.png" alt="" style="width:24px;height:24px;object-fit:contain;border-radius:4px">
<b>F2VTT</b>
<span class="mapword">Map</span>
<span class="by">by Ghilas</span>
</div>

<button class="btn" id="add">＋ Ajouter un spot</button>
</div>

<button id="locate" title="Ma position" aria-label="Ma position">⌾</button>

<div id="status"></div>

<div id="drawChoice" class="panel">

<h2>📍 Ajouter un spot</h2>

<div class="muted">
Choisis le type de tracé à ajouter.
</div>

<div class="draw-choice-actions">

<button class="draw-choice-btn" id="addPoint">
📍 Ajouter un point
</button>

<button class="draw-choice-btn" id="addLine">
〰️ Ajouter une ligne
</button>

</div>

<div class="actions" style="margin-top:8px">
<button class="cancel" id="cancelDrawChoice">Annuler</button>
</div>

</div>

<div id="form" class="panel">

<h2>📍 Ajouter un spot</h2>

<div id="formHint" class="muted">
Clique sur la carte pour placer précisément le spot.
</div>

<label>Nom</label>
<input id="name" maxlength="80" placeholder="Ex. Descente au Parc">

<div class="row">

<div>
<label>Type</label>
<select id="type">
<option>Descente</option>
<option>Sentier</option>
<option>Pumptrack</option>
<option>Spot urbain</option>
<option>Rampe</option>
<option>Skatepark</option>
<option>Autre</option>
</select>
</div>

<div>
<label>Difficulté</label>
<select id="diff">
<option value="0">🔘 Varié</option>
<option value="1">🟢 Easy</option>
<option value="2">🟡 Plutôt easy</option>
<option value="3">🟠 Moyen</option>
<option value="4">🔴 Difficile</option>
<option value="5">⚫ Hard 🔥</option>
</select>
</div>

</div>

<label>Photos — maximum 5</label>

<input id="photos" type="file" accept="image/*" multiple>

<div id="photoHelp" class="photo-count">
0 / 5 photo
</div>

<div id="preview" class="preview"></div>

<label>Description</label>

<textarea id="desc" maxlength="500" placeholder="Décris le spot..."></textarea>

<div class="actions">

</div>

<div id="info" class="panel info-panel">

<button id="closeInfo" class="close-info" aria-label="Fermer" title="Fermer">×</button>

<h2 id="infoName"></h2>

<div id="infoMeta" class="muted"></div>

<div id="infoGallery" class="gallery"></div>

<div id="infoPhotoCount" class="photo-count"></div>

<p id="infoDesc"></p>

<a id="googleMaps" class="maps-btn" target="_blank" rel="noopener">
📍 Ouvrir dans Google Maps
</a>

<button class="maps-btn" id="edit" style="margin-top:8px;background:#188038;color:#fff;border:0">
✏️ Modifier le spot
</button>

<button class="delete-btn" id="delete">
Supprimer ce spot
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>

const SUPABASE_URL='https://bhqhbiaejcbijlprjimy.supabase.co';

const SUPABASE_KEY='sb_publishable_jplSlzJVE2g_TxQB3nlp1Q_hHlhEpE1';

const sb=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>

<script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.3/dist/leaflet-rotate.umd.min.js"></script>

<script>

const B=[[50.48,2.85],[50.82,3.35]];

const map=L.map('map',{
maxBounds:B,
maxBoundsViscosity:0,
minZoom:10,
maxZoom:18,
zoomControl:false,
rotate:true,
touchRotate:true,
bearing:0,
zoomAnimation:false
});

map.fitBounds(B);

const planLayer=L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}
).addTo(map);

const satelliteLayer=L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:19,
maxNativeZoom:18,
attribution:'Tiles &copy; Esri'
}
);

L.control.layers(
{
'🗺️ Plan':planLayer,
'🛰️ Satellite':satelliteLayer
},
null,
{
collapsed:true,
position:'topright'
}
).addTo(map);

const levels={
0:['🔘','Varié'],
1:['🟢','Easy'],
2:['🟡','Plutôt easy'],
3:['🟠','Moyen'],
4:['🔴','Difficile'],
5:['⚫','Hard 🔥']
};

document.getElementById('zoomIn').onclick=()=>{
map.zoomIn();
};

document.getElementById('zoomOut').onclick=()=>{
map.zoomOut();
};

let spots=[];
let markers=[];
let lineLayers=[];
let placing=false;
let point=null;
let selected=null;
let photos=[];

let drawMode=null;
let linePoints=[];
let currentLine=null;

function msg(t){

let x=document.getElementById('status');

x.textContent=t;
x.style.display='block';

setTimeout(()=>{
x.style.display='none';
},1800);

}

function normalizeGeometry(g){

if(!g)return null;

if(
typeof g==='object' &&
g.type==='LineString' &&
Array.isArray(g.coordinates)
){

return {

type:'LineString',

coordinates:g.coordinates
.filter(c=>
Array.isArray(c)&&
c.length>=2&&
Number.isFinite(Number(c[0]))&&
Number.isFinite(Number(c[1]))
)
.map(c=>[
Number(c[0]),
Number(c[1])
])

};

}

return null;

}

function geometryToLatLngs(g){

const geometry=normalizeGeometry(g);

if(!geometry)return [];

return geometry.coordinates.map(c=>[
Number(c[1]),
Number(c[0])
]);

}

function lineAnchor(s){

const geometry=normalizeGeometry(s.geometry);

if(
geometry&&
geometry.coordinates.length
){

return {
lat:Number(geometry.coordinates[0][1]),
lng:Number(geometry.coordinates[0][0])
};

}

return {
lat:Number(s.lat),
lng:Number(s.lng)
};

}

function getGooglePosition(s){
return lineAnchor(s);
}

async function loadSpots(){

const {data,error}=await sb
.from('spots')
.select('*')
.order('created_at',{ascending:true});

if(error){

console.error('Erreur chargement spots:',error);

msg('Impossible de charger les spots');

return;

}

spots=(data||[]).map(s=>({

id:s.id,
name:s.name,
type:s.category||'Autre',

diff:
s.difficulty===null||
s.difficulty===undefined
?1
:Math.min(
5,
Math.max(
0,
Number(s.difficulty)
)
),

desc:s.description||'',

lat:Number(s.latitude),
lng:Number(s.longitude),

photos:
Array.isArray(s.photos)
?s.photos.slice(0,5)
:[],

geometry:
normalizeGeometry(s.geometry)

}));

render();

}

async function addSpotToSupabase(data){

const difficulty=
Number.isFinite(Number(data.diff))
?Number(data.diff)
:1;

const {data:created,error}=await sb
.from('spots')
.insert({

name:data.name,
description:data.desc||'',
category:data.type||'Autre',
difficulty:difficulty,
latitude:Number(data.lat),
longitude:Number(data.lng),

photos:
Array.isArray(data.photos)
?data.photos.slice(0,5)
:[],

geometry:
data.geometry||null

})
.select()
.single();

if(error){

console.error('Erreur ajout:',error);

msg('Erreur lors de l’ajout');

return null;

}

return created;

}

async function updateSpotInSupabase(id,data){

const difficulty=
Number.isFinite(Number(data.diff))
?Number(data.diff)
:1;

const {error}=await sb
.from('spots')
.update({

name:data.name,
description:data.desc||'',
category:data.type||'Autre',
difficulty:difficulty,
latitude:Number(data.lat),
longitude:Number(data.lng),

photos:
Array.isArray(data.photos)
?data.photos.slice(0,5)
:[],

geometry:
data.geometry||null

})
.eq('id',id);

if(error){

console.error('Erreur modification:',error);

msg('Erreur lors de la modification');

return false;

}

return true;

}

async function deleteSpotFromSupabase(id){

const {error}=await sb
.from('spots')
.delete()
.eq('id',id);

if(error){

console.error('Erreur suppression:',error);

msg('Erreur lors de la suppression');

return false;

}

return true;

}

function esc(s){

return String(s||'').replace(
/[&<>"']/g,
c=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[c])

);

}

function gmaps(lat,lng){

return 'https://www.google.com/maps/dir/?api=1&destination='+
encodeURIComponent(lat+','+lng);

}

function icon(d){

d=Math.min(
5,
Math.max(
0,
Number(d)||0
)
);

if(d===0){

return L.divIcon({

className:'',

html:
'<div style="font-size:27px;color:#d1d5db;text-shadow:0 1px 2px #0005">🔘</div>',

iconSize:[28,28],

iconAnchor:[14,14]

});

}

return L.divIcon({

className:'',

html:
'<div style="font-size:24px">'+
levels[d][0]+
'</div>',

iconSize:[28,28],

iconAnchor:[14,14]

});

}

function render(){

markers.forEach(m=>{
map.removeLayer(m);
});

markers=[];

lineLayers.forEach(l=>{
map.removeLayer(l);
});

lineLayers=[];

spots.forEach((s,i)=>{

let d=Math.min(
5,
Math.max(
0,
Number(s.diff)||0
)
);

const geometry=
normalizeGeometry(s.geometry);

if(
geometry&&
geometry.coordinates.length>=2
){

let latlngs=
geometryToLatLngs(geometry);

let line=L.polyline(
latlngs,
{
color:'#188038',
weight:5,
opacity:.9,
lineCap:'round',
lineJoin:'round',
renderer:L.svg()
}
).addTo(map);

line.bindPopup(

'<b>🚵 '+esc(s.name)+'</b><br>'+
levels[d][0]+' '+
levels[d][1]+
' · '+
esc(s.type)+
'<br>'+
'<a href="'+
gmaps(
lineAnchor(s).lat,
lineAnchor(s).lng
)+
'" target="_blank">'+
'Ouvrir dans Google Maps →'+
'</a>'+
'<br>'+
'<button onclick="showInfo('+i+')">'+
'Voir le spot'+
'</button>'

);

lineLayers.push(line);

return;

}

let m=L.marker(
[s.lat,s.lng],
{
icon:icon(d),
rotateWithView:true
}
).addTo(map);

m.bindPopup(

'<b>🚵 '+esc(s.name)+'</b><br>'+
levels[d][0]+' '+
levels[d][1]+
' · '+
esc(s.type)+
'<br>'+
'<a href="'+
gmaps(s.lat,s.lng)+
'" target="_blank">'+
'Ouvrir dans Google Maps →'+
'</a>'+
'<br>'+
'<button onclick="showInfo('+i+')">'+
'Voir le spot'+
'</button>'

);

markers.push(m);

});

}

function redrawLines(){

lineLayers.forEach(line=>{

if(
line &&
typeof line.redraw==='function'
){

line.redraw();

}

});

}

map.on('zoomend',redrawLines);
map.on('moveend',redrawLines);

if(typeof map.on==='function'){

map.on('rotate',redrawLines);

}

document.getElementById('add').onclick=()=>{

placing=false;
drawMode=null;
point=null;
linePoints=[];

if(currentLine){
map.removeLayer(currentLine);
currentLine=null;
}

document.getElementById('info')
.classList.remove('show');

document.getElementById('form')
.classList.remove('show');

document.getElementById('drawChoice')
.classList.add('show');

};

document.getElementById('cancelDrawChoice').onclick=()=>{

placing=false;
drawMode=null;
point=null;
linePoints=[];

if(currentLine){
map.removeLayer(currentLine);
currentLine=null;
}

document.getElementById('drawChoice')
.classList.remove('show');

};

document.getElementById('addPoint').onclick=()=>{

drawMode='point';
placing=true;
point=null;
linePoints=[];

document.getElementById('drawChoice')
.classList.remove('show');

msg(
'Clique sur la carte à l’emplacement du spot'
);

};

document.getElementById('addLine').onclick=()=>{

drawMode='line';
placing=true;
point=null;
linePoints=[];

document.getElementById('drawChoice')
.classList.remove('show');

document.getElementById('finishLine')
.classList.remove('show');

msg(
'Clique plusieurs fois sur la carte pour tracer la ligne'
);

};

map.on('click',e=>{

if(!placing)return;

if(drawMode==='point'){

point=e.latlng;
placing=false;

document.getElementById('formHint')
.textContent=
'Clique sur la carte pour placer précisément le spot.';

document.getElementById('form')
.classList.add('show');

document.getElementById('name').focus();

return;

}

if(drawMode==='line'){

linePoints.push([
Number(e.latlng.lat.toFixed(7)),
Number(e.latlng.lng.toFixed(7))
]);

if(!currentLine){

currentLine=L.polyline(
linePoints,
{
color:'#188038',
weight:5,
opacity:.9,
lineCap:'round',
lineJoin:'round',
renderer:L.svg()
}
).addTo(map);

}else{

currentLine.setLatLngs(linePoints);

}

if(linePoints.length>=2){

document.getElementById('finishLine')
.classList.add('show');

}

}

});

document.getElementById('finishLine').onclick=()=>{

if(
drawMode!=='line'||
linePoints.length<2
){

msg('Ajoute au moins 2 points');

return;

}

const first=linePoints[0];

point={
lat:first[0],
lng:first[1]
};

placing=false;

document.getElementById('finishLine')
.classList.remove('show');

document.getElementById('formHint')
.textContent=
'La ligne est tracée. Tu peux maintenant remplir les informations du spot.';

document.getElementById('form')
.classList.add('show');

document.getElementById('name').focus();

};

function renderPreview(){

document.getElementById('preview').innerHTML=

photos.map((p,i)=>

'<img src="'+
p+
'" data-photo-index="'+
i+
'" title="Cliquer pour supprimer cette photo">'

).join('');

document.getElementById('photoHelp').textContent=
photos.length+
' / 5 photos';

}

document.getElementById('preview').onclick=e=>{

let img=e.target.closest(
'img[data-photo-index]'
);

if(!img)return;

let i=Number(
img.dataset.photoIndex
);

if(confirm('Supprimer cette photo ?')){

photos.splice(i,1);

renderPreview();

}

};

document.getElementById('photos').onchange=async e=>{

let fs=Array.from(
e.target.files||[]
);

let left=5-photos.length;

if(fs.length>left){

msg('Maximum 5 photos par spot');

}

for(
let f of fs.slice(0,left)
){

if(!f.type.startsWith('image/'))
continue;

photos.push(

await new Promise(r=>{

let x=new FileReader();

x.onload=()=>{
r(x.result);
};

x.readAsDataURL(f);

})

);

}

e.target.value='';

renderPreview();

};

document.getElementById('close').onclick=()=>{

point=null;
photos=[];
placing=false;
selected=null;
drawMode=null;
linePoints=[];

if(currentLine){

map.removeLayer(currentLine);
currentLine=null;

}

document.getElementById('finishLine')
.classList.remove('show');

document.getElementById('form')
.classList.remove('show');

document.getElementById('save')
.textContent='Enregistrer';

document.getElementById('save')
.dataset.editing='';

document.getElementById('formHint')
.textContent=
'Clique sur la carte pour placer précisément le spot.';

renderPreview();

};

document.getElementById('save').onclick=async()=>{

let name=
document.getElementById('name')
.value
.trim();

if(!point||!name){

msg(
!point
?'Choisis l’emplacement sur la carte'
:'Ajoute un nom'
);

return;

}

let editing=
document.getElementById('save')
.dataset.editing==='1' &&
selected!==null;

let geometry=null;

if(
drawMode==='line'&&
linePoints.length>=2
){

geometry={

type:'LineString',

coordinates:
linePoints.map(p=>[
Number(p[1]),
Number(p[0])
])

};

}

if(editing){

const current=spots[selected];

if(
normalizeGeometry(current.geometry)
){

geometry=
normalizeGeometry(current.geometry);

}

}

let data={

name:name,

type:
document.getElementById('type').value,

diff:
Number(
document.getElementById('diff').value
),

desc:
document.getElementById('desc')
.value
.trim(),

lat:
Number(point.lat.toFixed(7)),

lng:
Number(point.lng.toFixed(7)),

photos:
photos.slice(0,5),

geometry:geometry

};

if(editing){

const current=spots[selected];

const success=
await updateSpotInSupabase(
current.id,
data
);

if(!success)return;

spots[selected]={

...data,

id:current.id

};

msg('Spot modifié ✅');

}else{

const created=
await addSpotToSupabase(data);

if(!created)return;

spots.push({

...data,

id:created.id

});

msg('Spot ajouté ✅');

}

document.getElementById('name').value='';

document.getElementById('desc').value='';

document.getElementById('preview').innerHTML='';

document.getElementById('photoHelp')
.textContent='0 / 5 photo';

document.getElementById('photos').value='';

point=null;
photos=[];
placing=false;
drawMode=null;
linePoints=[];

if(currentLine){

map.removeLayer(currentLine);
currentLine=null;

}

document.getElementById('finishLine')
.classList.remove('show');

document.getElementById('form')
.classList.remove('show');

document.getElementById('save')
.textContent='Enregistrer';

document.getElementById('save')
.dataset.editing='';

document.getElementById('formHint')
.textContent=
'Clique sur la carte pour placer précisément le spot.';

render();

if(editing){

selected=null;

}

};

window.showInfo=i=>{

selected=i;

let s=spots[i];

let d=Math.min(
5,
Math.max(
0,
Number(s.diff)||0
)
);

let l=levels[d];

let ps=
Array.isArray(s.photos)
?s.photos.slice(0,5)
:[];

document.getElementById('infoName')
.textContent=
'🚵 '+s.name;

const geometry=
normalizeGeometry(s.geometry);

let anchor=
lineAnchor(s);

if(
geometry&&
geometry.coordinates.length>=2
){

document.getElementById('infoMeta')
.textContent=
l[0]+' '+
l[1]+
' · '+
s.type+
' · Ligne · '+
geometry.coordinates.length+
' points';

}else{

document.getElementById('infoMeta')
.textContent=
l[0]+' '+
l[1]+
' · '+
s.type+
' · '+
Number(s.lat).toFixed(7)+
', '+
Number(s.lng).toFixed(7);

}

document.getElementById('infoDesc')
.textContent=
s.desc||
'Aucune description.';

document.getElementById('infoGallery')
.innerHTML=

ps.map(p=>

'<img src="'+
p+
'" alt="Photo de '+
esc(s.name)+
'">'

).join('');

document.getElementById('infoPhotoCount')
.textContent=
ps.length+
' / 5 photos';

document.getElementById('googleMaps')
.href=
gmaps(anchor.lat,anchor.lng);

document.getElementById('info')
.classList.add('show');

document.getElementById('form')
.classList.remove('show');

};

document.getElementById('edit').onclick=()=>{

if(selected===null)return;

let s=spots[selected];

let geometry=
normalizeGeometry(s.geometry);

point={

lat:Number(s.lat),
lng:Number(s.lng)

};

photos=
Array.isArray(s.photos)
?s.photos.slice(0,5)
:[];

document.getElementById('name')
.value=s.name||'';

document.getElementById('type')
.value=s.type||'Descente';

document.getElementById('diff')
.value=

(
s.diff===undefined||
s.diff===null
)

?'1'

:String(
Math.min(
5,
Math.max(
0,
Number(s.diff)
)
)
);

document.getElementById('desc')
.value=s.desc||'';

renderPreview();

if(
geometry&&
geometry.coordinates.length>=2
){

drawMode='line';

linePoints=
geometryToLatLngs(geometry)
.map(p=>[
Number(p[0]),
Number(p[1])
]);

}else{

drawMode='point';
linePoints=[];

}

document.getElementById('info')
.classList.remove('show');

document.getElementById('form')
.classList.add('show');

document.getElementById('save')
.textContent=
'Enregistrer les modifications';

document.getElementById('save')
.dataset.editing='1';

};

document.getElementById('delete').onclick=async()=>{

if(selected===null)return;

if(!confirm(
'Supprimer ce spot ? Cette action est irréversible.'
))return;

const id=spots[selected].id;

const success=
await deleteSpotFromSupabase(id);

if(!success)return;

spots.splice(
selected,
1
);

selected=null;

document.getElementById('info')
.classList.remove('show');

render();

msg('Spot supprimé ✅');

};

document.getElementById('locate').onclick=()=>{

if(!navigator.geolocation){

return msg(
'Géolocalisation indisponible'
);

}

navigator.geolocation.getCurrentPosition(

p=>{

let a=p.coords.latitude;
let b=p.coords.longitude;

if(
a<B[0][0]||
a>B[1][0]||
b<B[0][1]||
b>B[1][1]
){

return msg(
'Ta position est hors de la MEL'
);

}

map.setView(
[a,b],
15
);

L.circleMarker(
[a,b],
{radius:8}
)
.addTo(map)
.bindPopup('📍 Ta position')
.openPopup();

},

()=>{

msg(
'Autorise la localisation'
);

}

);

};

document.getElementById('closeInfo').onclick=()=>{

selected=null;

document.getElementById('info')
.classList.remove('show');

};

const lockScreen=
document.getElementById('lockScreen');

const lockPassword=
document.getElementById('lockPassword');

const lockError=
document.getElementById('lockError');

function unlock(){

if(
lockPassword.value===
'99f2vtt@'
){

lockScreen.style.display='none';

lockPassword.value='';

lockError.textContent='';

}else{

lockError.textContent=
'Mot de passe incorrect.';

lockPassword.focus();

lockPassword.select();

}

}

document.getElementById('lockSubmit')
.onclick=unlock;

lockPassword.addEventListener(
'keydown',
e=>{

if(e.key==='Enter'){

unlock();

}

});

loadSpots();

</script>

</body>
</html>
